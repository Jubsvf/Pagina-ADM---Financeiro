<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Leitor de Nota Fiscal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-wrapper { width: 100%; max-width: 400px; padding: 16px; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 36px 32px 28px; }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
    .login-logo p { font-size: 13px; color: #64748b; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #2563eb; }
    .btn-login { width: 100%; padding: 11px; background: #0f172a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    .btn-login:hover { background: #1e293b; }
    .error-msg { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
    .error-msg.visible { display: block; }
    .footer-note { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 20px; }
    .credentials-hint { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #0369a1; margin-bottom: 18px; }
    .credentials-hint strong { display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <h1>🧾 Leitor de NF</h1>
        <p>Sistema de Extracao de Notas Fiscais com IA</p>
      </div>
      <div class="credentials-hint">
        <strong>Credenciais de Acesso:</strong>
        Usuario: <code>admin</code> &nbsp;|&nbsp; Senha: <code>fintrack2025</code>
      </div>
      <div class="error-msg" id="errorMsg">Usuario ou senha incorretos. Tente novamente.</div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
      </form>
      <p class="footer-note">Atividade Pratica Academica — Leitor de NF com IA</p>
    </div>
  </div>
  <script>
    const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") && window.location.port !== "5000" ? "http://127.0.0.1:5000" : "";
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.classList.remove("visible");
      btn.textContent = "Entrando...";
      btn.disabled = true;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch(API_BASE + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }), credentials: "include" });
        const data = await res.json();
        if (res.ok && data.ok) { window.location.href = "/"; }
        else { errorMsg.classList.add("visible"); btn.textContent = "Entrar"; btn.disabled = false; }
      } catch (err) {
        errorMsg.textContent = "Erro de conexao com o servidor.";
        errorMsg.classList.add("visible");
        btn.textContent = "Entrar";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
