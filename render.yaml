services:
  - type: web
    name: agrofinanceiro-n2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir . server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
